<text x="96" y="134" fill="#5d63a8" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">1</text><text x="122" y="134" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" xml:space="preserve"><tspan fill="#c792ea">function</tspan><tspan fill="#82aaff"> quickSort</tspan><tspan fill="#d6deeb">(arr) {</tspan></text><text x="96" y="161" fill="#5d63a8" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">2</text><text x="122" y="161" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" xml:space="preserve"><tspan fill="#d6deeb">  </tspan><tspan fill="#c792ea">if</tspan><tspan fill="#d6deeb"> (arr.length &lt; </tspan><tspan fill="#f78c6c">2</tspan><tspan fill="#d6deeb">) </tspan><tspan fill="#c792ea">return</tspan><tspan fill="#d6deeb"> arr;</tspan></text><text x="96" y="188" fill="#5d63a8" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">3</text><text x="122" y="188" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" xml:space="preserve"><tspan fill="#d6deeb">  </tspan><tspan fill="#c792ea">const</tspan><tspan fill="#d6deeb"> [p, ...rest] = arr;</tspan></text><text x="96" y="215" fill="#5d63a8" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">4</text><text x="122" y="215" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" xml:space="preserve"><tspan fill="#d6deeb">  </tspan><tspan fill="#c792ea">const</tspan><tspan fill="#d6deeb"> l = rest.</tspan><tspan fill="#82aaff">filter</tspan><tspan fill="#d6deeb">(x =&gt; x &lt; p);</tspan></text><text x="96" y="242" fill="#5d63a8" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">5</text><text x="122" y="242" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" xml:space="preserve"><tspan fill="#d6deeb">  </tspan><tspan fill="#c792ea">const</tspan><tspan fill="#d6deeb"> r = rest.</tspan><tspan fill="#82aaff">filter</tspan><tspan fill="#d6deeb">(x =&gt; x &gt;= p);</tspan></text><text x="96" y="269" fill="#5d63a8" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">6</text><text x="122" y="269" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" xml:space="preserve"><tspan fill="#d6deeb">  </tspan><tspan fill="#c792ea">return</tspan><tspan fill="#d6deeb"> [...</tspan><tspan fill="#82aaff">quickSort</tspan><tspan fill="#d6deeb">(l), p, ...</tspan><tspan fill="#82aaff">quickSort</tspan><tspan fill="#d6deeb">(r)];</tspan></text><text x="96" y="296" fill="#5d63a8" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">7</text><text x="122" y="296" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" xml:space="preserve"><tspan fill="#d6deeb">}</tspan></text>
